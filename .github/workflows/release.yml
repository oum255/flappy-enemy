name: Release

# Quand on pousse un tag "v*" (ex. v1.0.0), construit l'application autonome pour chaque système
# et l'attache à une release GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the standalone app
        shell: bash
        run: ./scripts/package.sh

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent target/dist/FlappyEnemy.app FlappyEnemy-macOS.zip

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: cd target/dist && zip -r ../../FlappyEnemy-Linux.zip FlappyEnemy

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/dist/FlappyEnemy -DestinationPath FlappyEnemy-Windows.zip

      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          files: FlappyEnemy-*.zip

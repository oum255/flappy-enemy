# Paramètres d'équilibrage de Flappy Enemy.
# Vitesses en pixels par seconde, durées en secondes.
# Toute clé absente ou invalide reprend sa valeur par défaut (voir Settings.defaults()).

# --- Décor ---
# Vitesse de défilement au départ, gain par seconde de jeu, et plafond
scroll.speed=120
scroll.acceleration=1.5
scroll.maxSpeed=240

# --- Physique de l'ennemi ---
gravity.value=500
# Chaque pièce ramassée alourdit l'ennemi (jusqu'à un plafond)
gravity.bonusPerCoin=10
gravity.max=900
# Vitesse verticale d'un saut (négative = vers le haut) et vitesse de chute maximale
jump.speed=-300
fall.maxSpeed=300

# --- Tir ---
bullet.speed=300
shoot.delay=0.25

# --- Apparitions ---
# Délai entre deux héros : part de heros.delay et diminue de heros.delayReduction par seconde
# jusqu'à heros.minDelay
heroes.delay=3.0
heroes.minDelay=1.2
heroes.delayReduction=0.03
coins.delay=0.8
